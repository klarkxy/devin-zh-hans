name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装路径与回滚回归测试（不依赖 Devin 安装）
        run: node --test tools/test_installation.js
      - name: DOM 输入框回归测试
        run: node tools/test_dom_runtime.js

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 语法与清单检查
        run: |
          python - <<'PY'
          import ast, json, pathlib, sys
          bad = 0
          for p in pathlib.Path("tools").glob("*.py"):
              try:
                  ast.parse(p.read_text(encoding="utf-8"))
              except SyntaxError as e:
                  print("FAIL", p, e); bad += 1
          pkg = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))
          need = ("name", "displayName", "description", "version", "publisher", "engines", "main")
          miss = [k for k in need if k not in pkg]
          if miss:
              print("package.json 缺少字段:", miss); bad += 1
          # dist/ 是生成产物但必须提交；assets/ 里是四层落地所需的全部数据
          for f in ("extension.js", "README.md", "LICENSE",
                    "translations/main.i18n.json",
                    "translations/extensions/windsurf.i18n.json",
                    "dist/devin-zh-dom.js",
                    "assets/ui-dict.json",
                    "assets/ui-strings-zh.json",
                    "assets/webapp-i18n.json",
                    "assets/ext-manifest.json",
                    "assets/ext-manifest.en.json",
                    "assets/ext-manifest.zh.json"):
              p = pathlib.Path(f)
              if not p.exists():
                  print("缺少文件:", f); bad += 1
              elif p.stat().st_size == 0:
                  print("文件为空:", f); bad += 1
          # 扩展贡献点计划必须每条都有英文与中文，否则落地时会出现 %key%
          try:
              plan = json.loads(pathlib.Path("assets/ext-manifest.json").read_text(encoding="utf-8"))
              en = json.loads(pathlib.Path("assets/ext-manifest.en.json").read_text(encoding="utf-8"))
              zh = json.loads(pathlib.Path("assets/ext-manifest.zh.json").read_text(encoding="utf-8"))
              keys = [e["key"] for v in plan.values() for e in v]
              noz = [k for k in keys if k not in en or k not in zh]
              if noz:
                  print("扩展贡献点缺英/中文:", len(noz), noz[:3]); bad += 1
              print("扩展贡献点:", len(keys), "个字段全部可解析")
          except Exception as e:
              print("扩展贡献点计划校验失败:", e); bad += 1
          print("OK", "%s.%s" % (pkg.get("publisher"), pkg.get("name")), pkg.get("version"))
          sys.exit(1 if bad else 0)
          PY

      - name: 校验 tag 与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import json, os, pathlib, sys
          ver = json.loads(pathlib.Path("package.json").read_text(encoding="utf-8"))["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != "v" + ver:
              print("tag %s 与 package.json 的版本 %s 不一致，请先改 package.json" % (tag, ver))
              sys.exit(1)
          print("tag 与版本一致:", tag)
          PY

      - name: 打包
        run: python tools/build_vsix.py

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: build/*.vsix
          if-no-files-found: error

      - name: 发布 Release（打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVIN_PLUGIN_REPO: ${{ github.repository }}
        run: python tools/release.py
